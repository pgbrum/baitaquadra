<div class="fixed bottom-6 right-6 z-[60] flex flex-col gap-2 pointer-events-none" aria-live="polite">
  @for (t of toast.toasts(); track t.id) {
    <div class="pointer-events-auto px-4 py-3 rounded-lg shadow-lg text-sm font-semibold text-white flex items-center gap-2 animate-[fadeIn_.2s_ease-out]"
         [ngClass]="t.tipo === 'sucesso' ? 'bg-primary' : 'bg-secondary'">
      <span>{{ t.tipo === 'sucesso' ? '✓' : '!' }}</span>
      {{ t.mensagem }}
    </div>
  }
</div>
