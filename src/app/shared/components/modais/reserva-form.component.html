<form (ngSubmit)="salvar()" class="flex flex-col max-h-[90vh]">
  <div class="px-6 pt-6 pb-4 border-b border-gray-100 flex justify-between items-start">
    <div>
      <h2 class="text-xl font-bold text-neutral-900">Nova Reserva</h2>
      <p class="text-sm text-gray-500 mt-0.5">Preencha os dados para agendar a quadra.</p>
    </div>
    <button type="button" (click)="fechar()" class="text-gray-400 hover:text-gray-600 text-xl leading-none" aria-label="Fechar">×</button>
  </div>

  <div class="px-6 py-5 space-y-4 overflow-y-auto">
    <!-- Tipo -->
    <div class="grid grid-cols-3 gap-2">
      @for (t of tipos; track t) {
        <button type="button" (click)="tipo.set(t)"
                class="py-2 rounded-lg text-xs font-bold border transition-colors"
                [ngClass]="tipo() === t ? 'bg-primary text-white border-primary' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
          {{ t }}
        </button>
      }
    </div>

    @if (tipo() === 'LOCAÇÃO') {
      <div>
        <label for="r-cliente" class="block text-sm font-medium text-gray-700 mb-1">Cliente</label>
        <select id="r-cliente" name="cliente" [(ngModel)]="clienteId" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary bg-white">
          <option value="">Selecione...</option>
          @for (c of clientes(); track c.id) {
            <option [value]="c.id">{{ c.nome }}</option>
          }
        </select>
      </div>
    } @else {
      <div>
        <label for="r-titulo" class="block text-sm font-medium text-gray-700 mb-1">Título</label>
        <input id="r-titulo" name="titulo" [(ngModel)]="titulo" [placeholder]="tipo() === 'AULA' ? 'Ex.: Intermediário - Prof. Ana' : 'Ex.: Copa Primavera'"
               class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary">
      </div>
    }

    <div>
      <label for="r-quadra" class="block text-sm font-medium text-gray-700 mb-1">Quadra</label>
      <select id="r-quadra" name="quadra" [ngModel]="quadraId()" (ngModelChange)="quadraId.set($event)" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary bg-white">
        @for (q of quadrasDisponiveis(); track q.id) {
          <option [value]="q.id">{{ q.nome }} — {{ q.tipo }} • {{ q.esporte }}</option>
        }
      </select>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div>
        <label for="r-data" class="block text-sm font-medium text-gray-700 mb-1">Data</label>
        <input id="r-data" type="date" name="data" [(ngModel)]="data" required class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary">
      </div>
      <div>
        <label for="r-hora" class="block text-sm font-medium text-gray-700 mb-1">Início</label>
        <select id="r-hora" name="hora" [(ngModel)]="hora" class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary bg-white">
          @for (h of horarios; track h) { <option [value]="h">{{ h }}</option> }
        </select>
      </div>
      <div>
        <label for="r-duracao" class="block text-sm font-medium text-gray-700 mb-1">Duração</label>
        <select id="r-duracao" name="duracao" [ngModel]="duracao()" (ngModelChange)="duracao.set(+$event)" class="w-full px-3 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary bg-white">
          @for (d of duracoes; track d.v) { <option [value]="d.v">{{ d.r }}</option> }
        </select>
      </div>
    </div>

    <div>
      <label for="r-desc" class="block text-sm font-medium text-gray-700 mb-1">Observação <span class="text-gray-400 font-normal">(opcional)</span></label>
      <input id="r-desc" name="descricao" [(ngModel)]="descricao" placeholder="Ex.: 4 alunos, levar bolas" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary">
    </div>

    <div class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-3">
      <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
        <input type="checkbox" name="pago" [(ngModel)]="pago" class="rounded text-primary border-gray-300">
        Pagamento já realizado
      </label>
      <span class="text-sm text-gray-500">Valor: <strong class="text-primary">{{ valorEstimado() | currency:'BRL':'symbol' }}</strong></span>
    </div>

    @if (erro()) {
      <p class="text-sm text-secondary bg-red-50 border border-red-100 rounded-lg px-3 py-2">{{ erro() }}</p>
    }
  </div>

  <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
    <button type="button" (click)="fechar()" class="px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100">Cancelar</button>
    <button type="submit" [disabled]="salvando()" class="bg-primary text-white px-5 py-2 rounded-lg font-bold hover:bg-green-800 transition-colors disabled:opacity-60">
      {{ salvando() ? 'Salvando...' : 'Confirmar Reserva' }}
    </button>
  </div>
</form>
