<form (ngSubmit)="salvar()" class="flex flex-col">
  <div class="px-6 pt-6 pb-4 border-b border-gray-100 flex justify-between items-start">
    <div>
      <h2 class="text-xl font-bold text-neutral-900">{{ cliente ? 'Editar Cliente' : 'Novo Cliente' }}</h2>
      <p class="text-sm text-gray-500 mt-0.5">{{ cliente ? 'Membro desde ' + cliente.membroDesde : 'Cadastre um novo frequentador.' }}</p>
    </div>
    <button type="button" (click)="fechar()" class="text-gray-400 hover:text-gray-600 text-xl leading-none" aria-label="Fechar">×</button>
  </div>

  <div class="px-6 py-5 space-y-4">
    <div>
      <label for="c-nome" class="block text-sm font-medium text-gray-700 mb-1">Nome completo</label>
      <input id="c-nome" name="nome" [(ngModel)]="nome" placeholder="Ex.: Maria Oliveira" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary">
    </div>
    <div>
      <label for="c-contato" class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
      <input id="c-contato" name="contato" inputmode="tel" [value]="contato" (input)="mascararContato($event)" placeholder="(51) 99999-9999" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label for="c-nivel" class="block text-sm font-medium text-gray-700 mb-1">Nível</label>
        <select id="c-nivel" name="nivel" [(ngModel)]="nivel" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary bg-white">
          @for (n of niveis; track n) { <option [value]="n">{{ n }}</option> }
        </select>
      </div>
      <div>
        <label for="c-saldo" class="block text-sm font-medium text-gray-700 mb-1">Saldo (R$)</label>
        <input id="c-saldo" name="saldo" type="number" step="0.01" [(ngModel)]="saldo" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary">
      </div>
    </div>

    @if (erro()) {
      <p class="text-sm text-secondary bg-red-50 border border-red-100 rounded-lg px-3 py-2">{{ erro() }}</p>
    }
  </div>

  <div class="px-6 py-4 border-t border-gray-100 flex items-center gap-2">
    @if (cliente) {
      <button type="button" (click)="excluir()" [disabled]="salvando()"
              class="px-4 py-2 rounded-lg text-sm font-bold disabled:opacity-60 transition-colors"
              [ngClass]="confirmarExclusao() ? 'bg-secondary text-white' : 'text-secondary hover:bg-red-50'">
        {{ confirmarExclusao() ? 'Confirmar exclusão' : 'Excluir' }}
      </button>
    }
    <div class="flex-1"></div>
    <button type="button" (click)="fechar()" class="px-4 py-2 rounded-lg font-semibold text-gray-600 hover:bg-gray-100">Cancelar</button>
    <button type="submit" [disabled]="salvando()" class="bg-primary text-white px-5 py-2 rounded-lg font-bold hover:bg-green-800 transition-colors disabled:opacity-60">
      {{ salvando() ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</form>
