<div class="min-h-screen bg-neutral-100 flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <div class="text-primary font-bold text-2xl flex items-center gap-2">
        <img src="logo.png" alt="" class="w-12 h-12 object-contain">

        BaitaQuadra
      </div>
    </div>

    <h2 class="text-2xl font-bold text-neutral-900 text-center mb-6">Acesse sua conta</h2>

    <form class="space-y-5" (ngSubmit)="entrar()">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" [(ngModel)]="email" placeholder="seu@email.com" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary transition-colors">
      </div>

      <div>
        <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" [(ngModel)]="senha" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary transition-colors">
      </div>

      @if (erro()) {
        <p class="text-sm text-secondary bg-red-50 border border-red-100 rounded-lg px-3 py-2">{{ erro() }}</p>
      }

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="lembrar" [(ngModel)]="lembrar" class="rounded text-primary focus:ring-primary border-gray-300">
          <span class="text-gray-600">Lembrar de mim</span>
        </label>
        <a href="#" class="text-primary font-semibold hover:underline">Esqueceu a senha?</a>
      </div>

      <!-- Autentica na API (/api/auth/login) e guarda o token JWT -->
      <button type="submit" [disabled]="carregando()" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-green-800 transition-colors mt-2 disabled:opacity-60 disabled:cursor-wait">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
