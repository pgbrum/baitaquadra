<div class="min-h-screen bg-neutral-100 flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <div class="text-primary font-bold text-2xl flex items-center gap-2">
        <div class="w-8 h-8 border-2 border-primary rounded-md"></div>
        BaitaQuadra
      </div>
    </div>

    <h2 class="text-2xl font-bold text-neutral-900 text-center mb-6">Acesse sua conta</h2>

    <form class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
        <input type="email" placeholder="seu@email.com" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary transition-colors">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" placeholder="••••••••" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none focus:border-primary transition-colors">
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="rounded text-primary focus:ring-primary border-gray-300">
          <span class="text-gray-600">Lembrar de mim</span>
        </label>
        <a href="#" class="text-primary font-semibold hover:underline">Esqueceu a senha?</a>
      </div>

      <!-- O routerLink faz a navegação visual (mock) sem precisar de autenticação real ainda -->
      <button routerLink="/dashboard" type="button" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-green-800 transition-colors mt-2">
        Entrar
      </button>
    </form>
  </div>
</div>
